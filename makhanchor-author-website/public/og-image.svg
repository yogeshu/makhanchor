<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Rich deep space / midnight gradient background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07040e" />
      <stop offset="50%" stop-color="#0f0a24" />
      <stop offset="100%" stop-color="#080512" />
    </linearGradient>
    
    <!-- Coral glowing gradient for brand highlights -->
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b5c" />
      <stop offset="100%" stop-color="#e0533c" />
    </linearGradient>

    <!-- Warm gold glow gradient for orbits -->
    <radialGradient id="orbitGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb09c" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#07040e" stop-opacity="0" />
    </radialGradient>
    
    <style>
      .og-title {
        font-family: 'Playfair Display', 'Georgia', serif;
        font-weight: 700;
        fill: #ffffff;
        font-size: 72px;
        letter-spacing: 0.05em;
      }
      .og-subtitle {
        font-family: 'Inter', sans-serif;
        font-weight: 500;
        fill: #ff7b5c;
        font-size: 20px;
        letter-spacing: 0.4em;
        text-transform: uppercase;
      }
      .og-quote {
        font-family: 'Playfair Display', 'Georgia', serif;
        font-style: italic;
        fill: #e2dcf0;
        font-size: 26px;
        line-height: 1.6;
        opacity: 0.85;
      }
      .og-novel-title {
        font-family: 'Playfair Display', 'Georgia', serif;
        font-weight: 600;
        fill: #ffffff;
        font-size: 38px;
        letter-spacing: 0.02em;
      }
      .og-novel-meta {
        font-family: 'Inter', sans-serif;
        font-size: 14px;
        fill: #a59cb8;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }
      .og-badge {
        font-family: 'Inter', sans-serif;
        font-weight: 600;
        fill: #ffffff;
        font-size: 14px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }
    </style>
  </defs>

  <!-- Background base -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Abstract poetic background elements (cosmic orbits) -->
  <circle cx="1000" cy="315" r="450" fill="url(#orbitGlow)" />
  <circle cx="1000" cy="315" r="320" stroke="#ff7b5c" stroke-width="1" stroke-dasharray="4 8" stroke-opacity="0.2" fill="none" />
  <circle cx="1000" cy="315" r="220" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15" fill="none" />
  <circle cx="1000" cy="315" r="120" stroke="#ff7b5c" stroke-width="1.5" stroke-opacity="0.3" fill="none" />

  <!-- Stars of 3 a.m. -->
  <g opacity="0.6">
    <circle cx="120" cy="90" r="1.5" fill="#ffffff" />
    <circle cx="280" cy="150" r="1" fill="#ff7b5c" />
    <circle cx="450" cy="80" r="2" fill="#ffffff" />
    <circle cx="850" cy="120" r="1.5" fill="#ffffff" />
    <circle cx="950" cy="70" r="1" fill="#ffffff" />
    <circle cx="1100" cy="190" r="2.5" fill="#ffb09c" />
    <circle cx="150" cy="540" r="1.5" fill="#ffffff" />
    <circle cx="580" cy="590" r="1" fill="#ffffff" />
  </g>

  <!-- Brand header (top left) -->
  <g transform="translate(100, 80)">
    <!-- Brand logo icon -->
    <path 
      d="M0 -15 C-4 -6, -14 -4, -14 5 C-14 12, -7 17, 0 17 C7 17, 14 12, 14 5 C14 -4, 4 -6, 0 -15 Z" 
      fill="url(#coralGrad)" 
      transform="scale(1.2)"
    />
    <path 
      d="M0 -5 L0 16" 
      stroke="#0f0a24" 
      stroke-width="2" 
      stroke-linecap="round" 
    />
    <circle cx="0" cy="-6" r="2" fill="#ffffff" />
    
    <text x="35" y="6" class="og-title" style="font-size: 32px;">Makhanchor</text>
    <text x="37" y="24" class="og-subtitle" style="font-size: 10px; letter-spacing: 0.25em;">Poetry &amp; Stories that Heal</text>
  </g>

  <!-- Left Column - Literary Quote -->
  <g transform="translate(100, 240)">
    <!-- Decorative poetry parenthesis -->
    <text x="-15" y="40" font-family="Georgia" font-size="90" fill="#ff7b5c" opacity="0.25">“</text>
    <text x="30" y="30" class="og-quote">some weights are warmer than being free,</text>
    <text x="30" y="80" class="og-quote">and some rains never learn to clear.</text>
    <text x="30" y="140" font-family="Inter" font-weight="600" fill="#ff7b5c" font-size="14" letter-spacing="0.1em" text-transform="uppercase">— from the novel Excerpt</text>
  </g>

  <!-- Right Column - Novel Showcase & Call To Action -->
  <g transform="translate(730, 160)">
    <!-- Notebook silhouette / Book mockup representation -->
    <rect x="0" y="0" width="280" height="360" rx="16" fill="#15102a" stroke="#ff7b5c" stroke-width="2" stroke-opacity="0.4" />
    <rect x="15" y="15" width="250" height="330" rx="10" fill="#1b1535" />
    
    <!-- Spine binding dots -->
    <line x1="25" y1="30" x2="25" y2="330" stroke="#ff7b5c" stroke-width="1.5" stroke-dasharray="4 6" stroke-opacity="0.4" />
    
    <!-- Notebook Cover Elements -->
    <text x="140" y="90" text-anchor="middle" class="og-novel-meta">Novel Excerpt</text>
    <text x="140" y="150" text-anchor="middle" class="og-novel-title">Love, Loss</text>
    <text x="140" y="195" text-anchor="middle" class="og-novel-title">&amp; Life</text>
    <text x="140" y="240" text-anchor="middle" font-family="Georgia" font-size="16" fill="#ffb09c" font-style="italic">by Yogesh Bhavsar</text>
    
    <!-- Heart icon decorative -->
    <path d="M140 278 C138 274, 131 274, 131 280 C131 285, 140 291, 140 291 C140 291, 149 285, 149 280 C149 274, 142 274, 140 278 Z" fill="#ff7b5c" />
    <line x1="60" y1="285" x2="115" y2="285" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
    <line x1="165" y1="285" x2="220" y2="285" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
  </g>

  <!-- Footer Banner - Call To Action -->
  <g transform="translate(100, 500)">
    <!-- Capsule tag -->
    <rect x="0" y="0" width="460" height="50" rx="25" fill="#ff7b5c" />
    <text x="230" y="31" text-anchor="middle" class="og-badge">READ CHAPTER ONE FREE NOW</text>
    
    <text x="490" y="31" font-family="Inter" font-size="14" fill="#a59cb8" letter-spacing="0.1em">Available on Amazon &amp; NotionPress</text>
  </g>
</svg>
